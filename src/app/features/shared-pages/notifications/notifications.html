<div class="min-h-screen bg-gray-950">

  <!-- Header -->
  <div class="bg-gradient-to-r from-indigo-900 to-purple-900 px-6 pt-10 pb-6">
    <div class="flex items-center justify-between max-w-2xl mx-auto">
      <div class="flex items-center gap-3">
        <button (click)="goBack()"
          class="w-9 h-9 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl flex items-center justify-center text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div>
          <h1 class="text-white font-bold text-xl">Notifications</h1>
          <p class="text-indigo-300 text-xs">{{ unreadCount }} non lue(s)</p>
        </div>
      </div>
      <button *ngIf="unreadCount > 0" (click)="markAllAsRead()"
        class="px-3 py-2 bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs font-semibold rounded-xl transition-colors">
        Tout marquer lu
      </button>
    </div>
  </div>

  <div class="max-w-2xl mx-auto px-6 py-6">

    <!-- Loading -->
    <div *ngIf="loading" class="space-y-3">
      <div *ngFor="let i of [1,2,3,4]" class="h-20 bg-gray-800 rounded-2xl animate-pulse"></div>
    </div>

    <!-- Vide -->
    <div *ngIf="!loading && notifications.length === 0"
      class="bg-gray-800 border border-dashed border-gray-700 rounded-2xl p-16 text-center">
      <p class="text-5xl mb-4">🔔</p>
      <p class="text-white font-semibold">Aucune notification</p>
      <p class="text-gray-500 text-sm mt-1">Vous n'avez pas encore de notifications</p>
    </div>

    <!-- Liste -->
    <div *ngIf="!loading && notifications.length > 0" class="space-y-3">
      <div *ngFor="let notif of notifications"
        (click)="!notif.is_read && markAsRead(notif.id)"
        [class]="'rounded-2xl p-4 border transition-all cursor-pointer ' +
          (notif.is_read
            ? 'bg-gray-800/50 border-gray-700/50'
            : 'bg-gray-800 border-indigo-500/30 hover:border-indigo-500/50')">

        <div class="flex items-start gap-4">
          <div [class]="'w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ' +
            (notif.is_read ? 'bg-gray-700' : 'bg-indigo-600/20')">
            <span class="text-xl">{{ getTypeIcon(notif.type) }}</span>
          </div>

          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <p [class]="'font-semibold text-sm ' + (notif.is_read ? 'text-gray-400' : 'text-white')">
                {{ notif.title }}
              </p>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span *ngIf="!notif.is_read"
                  class="w-2 h-2 bg-indigo-500 rounded-full flex-shrink-0">
                </span>
                <span class="text-gray-600 text-xs">{{ notif.created_at | slice:0:10 }}</span>
              </div>
            </div>
            <p [class]="'text-xs mt-1 leading-relaxed ' + (notif.is_read ? 'text-gray-600' : 'text-gray-400')">
              {{ notif.body }}
            </p>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
