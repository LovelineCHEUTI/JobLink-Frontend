<div class="min-h-screen bg-gray-950">

  <!-- Header -->
  <div class="bg-gradient-to-r from-purple-900 to-indigo-900 px-6 pt-10 pb-16">
    <div class="flex items-center gap-3 max-w-2xl mx-auto">
      <button (click)="goBack()"
        class="w-9 h-9 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl flex items-center justify-center text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div>
        <h1 class="text-white font-bold text-xl">Mon profil</h1>
        <p class="text-purple-300 text-xs">Modifier vos informations</p>
      </div>
    </div>
  </div>

  <div class="max-w-2xl mx-auto px-6 -mt-8 pb-8">

    <!-- Avatar -->
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 rounded-2xl bg-indigo-600 border-4 border-gray-950 flex items-center justify-center shadow-xl">
        <span class="text-white font-bold text-3xl">{{ user?.name?.charAt(0) }}</span>
      </div>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Nom -->
      <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5">
        <label class="block text-white font-semibold text-sm mb-1">👤 Nom complet *</label>
        <input type="text" formControlName="name"
          placeholder="Votre nom complet"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-colors text-sm"/>
        <span *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
          class="text-red-400 text-xs mt-1 block">Nom requis</span>
      </div>

      <!-- Téléphone -->
      <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5">
        <label class="block text-white font-semibold text-sm mb-1">
          📞 Téléphone
          <span class="text-gray-500 font-normal ml-1">(optionnel)</span>
        </label>
        <input type="tel" formControlName="phone"
          placeholder="+237 6XX XXX XXX"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-colors text-sm"/>
      </div>

      <!-- Ville -->
      <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5">
        <label class="block text-white font-semibold text-sm mb-1">
          📍 Ville
          <span class="text-gray-500 font-normal ml-1">(optionnel)</span>
        </label>
        <input type="text" formControlName="city"
          placeholder="Ex: Yaoundé"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-colors text-sm"/>
      </div>

      <!-- Description -->
      <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5">
        <label class="block text-white font-semibold text-sm mb-1">
          📝 Description professionnelle
          <span class="text-gray-500 font-normal ml-1">(optionnel)</span>
        </label>
        <p class="text-gray-500 text-xs mb-3">Cette description apparaîtra sur votre profil public</p>
        <textarea formControlName="description" rows="4"
          placeholder="Décrivez votre expérience, vos compétences et votre expertise..."
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition-colors resize-none text-sm">
        </textarea>
      </div>

      <!-- Messages -->
      <div *ngIf="success"
        class="bg-green-500/10 border border-green-500/30 rounded-xl p-4 text-green-400 text-sm text-center">
        ✅ {{ success }}
      </div>
      <div *ngIf="error"
        class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 text-red-400 text-sm text-center">
        ⚠ {{ error }}
      </div>

      <button type="submit" [disabled]="loading || form.invalid"
        class="w-full py-4 bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-bold rounded-2xl transition-all duration-200 text-base">
        {{ loading ? '⏳ Mise à jour...' : '✅ Sauvegarder les modifications' }}
      </button>

    </form>
  </div>
</div>
