<div class="stars-bg min-h-screen flex flex-col items-center justify-center px-6 relative overflow-hidden">

  <div class="glow-orb w-96 h-96 bg-indigo-600 top-[-100px] left-[-100px]"></div>
  <div class="glow-orb w-80 h-80 bg-purple-600 bottom-[-80px] right-[-80px]"></div>

  <div class="relative z-10 w-full max-w-sm">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Connexion</h1>
      <p class="text-gray-400">Accédez à votre compte JobLink</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-gray-400 text-sm mb-2">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="votre@email.com"
          class="w-full px-4 py-4 bg-gray-800 border border-gray-700 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"/>
        <span *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
          class="text-red-400 text-xs mt-1 block">
          Email invalide
        </span>
      </div>

      <div>
        <label class="block text-gray-400 text-sm mb-2">Mot de passe</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-4 bg-gray-800 border border-gray-700 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors pr-12"/>
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
        <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="text-red-400 text-xs mt-1 block">
          Minimum 8 caractères
        </span>
      </div>

      <p *ngIf="error" class="text-red-400 text-sm text-center">{{ error }}</p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-semibold rounded-2xl transition-all duration-200 text-lg mt-2">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </form>

    <p class="text-center text-gray-400 mt-6">
      Pas de compte ?
      <a routerLink="/auth/register" class="text-indigo-400 hover:text-indigo-300 font-semibold">
        S'inscrire
      </a>
    </p>

    <p class="text-center mt-4">
      <a routerLink="/auth" class="text-gray-600 hover:text-gray-400 text-sm">
        ← Retour
      </a>
    </p>

  </div>
</div>
