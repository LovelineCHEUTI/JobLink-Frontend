<section id="services" class="bg-gray-900 py-24 px-6">
  <div class="max-w-6xl mx-auto">

    <div appReveal class="text-center max-w-xl mx-auto mb-14">
      <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Des services pour chaque besoin</h2>
      <p class="text-gray-400 text-lg">Des professionnels qualifiés, disponibles dans toutes ces catégories.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
      <button *ngFor="let category of categories; let i = index"
        appReveal [revealDelay]="i * 60"
        (click)="selectCategory()"
        [title]="category.name"
        [class]="'group relative overflow-hidden text-left rounded-2xl p-5 bg-gradient-to-br border border-gray-800 hover:border-indigo-500/40 hover:-translate-y-1 transition-all duration-300 ' + category.color">
        <span class="text-3xl block mb-3">{{ category.icon }}</span>
        <h3 class="text-white font-bold text-sm mb-1">{{ category.name }}</h3>
        <p class="text-gray-400 text-xs leading-snug">{{ category.description }}</p>
      </button>
    </div>

  </div>
</section>
