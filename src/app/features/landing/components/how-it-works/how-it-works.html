<section id="how-it-works" class="bg-gray-950 py-24 px-6">
  <div class="max-w-6xl mx-auto">

    <div appReveal class="text-center max-w-xl mx-auto mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Comment fonctionne JobLink ?</h2>
      <p class="text-gray-400 text-lg">Un parcours simple, en quatre étapes, du besoin à la prestation.</p>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let step of steps; let i = index"
        appReveal [revealDelay]="i * 100"
        class="relative bg-gray-900 border border-gray-800 rounded-2xl p-6 hover:border-indigo-500/50 hover:-translate-y-1 transition-all duration-300">

        <span class="text-5xl font-bold text-gray-800 leading-none">{{ step.number }}</span>

        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center mt-4 mb-4">
          <svg *ngIf="step.icon === 'search'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <svg *ngIf="step.icon === 'check'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <svg *ngIf="step.icon === 'send'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
          </svg>
          <svg *ngIf="step.icon === 'star'" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/>
          </svg>
        </div>

        <h3 class="text-white font-bold text-lg mb-2">{{ step.title }}</h3>
        <p class="text-gray-400 text-sm leading-relaxed">{{ step.description }}</p>
      </div>
    </div>

  </div>
</section>
